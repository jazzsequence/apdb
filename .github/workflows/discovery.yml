name: Weekly discovery sweep

# Data collection, moved off whatever machine happens to be awake.
#
# Every import adapter here needs the open internet — Wikipedia, Wikidata, the
# fan wikis, YouTube, archive.org — and a sandboxed agent session frequently
# does not have it. A runner does, on a schedule, for free. So the sweep runs
# here and the result arrives the way everything else in this project arrives:
# as a pull request somebody reads.
#
# The PR it opens contains two different kinds of thing, and they are reviewed
# differently:
#
#   - A DATA change: the duplicate fold. `dedupe` merges credits it can show
#     describe the same appearance and unions their sources. It makes no
#     sourcing claim and adds no credit — it is a mechanical transform of data
#     that already passed CI, and it is idempotent.
#   - A REPORT: the discovery candidates. These are NOT filed. Every one came
#     from a reference work or a fan wiki, and POLICY.md uses Wikipedia being
#     wrong about this project's own subject as the worked example. Filing one
#     is a deliberate, separately-sourced edit a human makes afterwards.
#
# Because the job now writes to `data/`, it validates its own output before
# pushing. A PR opened with GITHUB_TOKEN does not trigger other workflows, so
# validate.yml does NOT run on it — the checks below are the only gate this
# change gets. Do not remove them.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: scheduled jobs pile up at
    # :00 across all of GitHub and get queued.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      people:
        description: 'How many people to sweep (blank = everyone with a QID or a Wikipedia link)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job level, not step level: a step's `if` cannot see that step's own `env`
    # and cannot see `secrets` at all, so checking either there is always false.
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: mkdir -p out

      # Each pass is allowed to fail on its own. One rate-limited source should
      # cost its own section of the report, not the whole week's sweep.
      - name: Person-first sweep (Wikipedia + Wikidata)
        continue-on-error: true
        run: |
          npm run discover:person -- \
            ${{ inputs.people && format('--limit {0}', inputs.people) || '--all' }} \
            --json out/person-sweep.json | tee out/person.log

      - name: Internet Archive
        continue-on-error: true
        timeout-minutes: 20
        run: npm run import:archive -- --dry-run > out/archive.log 2>&1

      # No key, no pass — and no keyless fallback, because scraping around
      # YouTube's API breaches their terms (see the source registry).
      - name: YouTube
        continue-on-error: true
        if: env.YOUTUBE_API_KEY != ''
        run: npm run discover:youtube > out/youtube.log 2>&1

      # Runs after the sweeps and writes the fold to data/.
      #
      # Duplicates accrue whenever an importer runs and this does not, and they
      # stay invisible until someone opens a particular person's page —
      # fourteen CelebriD&D people sat double-credited for months.
      #
      # Not continue-on-error: this is the data change the PR exists to carry,
      # so a failure here should fail the run rather than quietly open a PR
      # that folds nothing.
      - name: Fold duplicate credits
        run: npm run dedupe | tee out/dedupe.log

      # The safety net that replaces validate.yml, which will not run on this
      # PR. Schema, referential integrity, id uniqueness — the same gate every
      # human PR passes. If this fails, nothing is pushed.
      - name: Validate the folded data
        run: npm run validate

      # dedupe is idempotent, so a second pass must find nothing. If it does
      # find something, the merge rule is not converging and the fold above is
      # not trustworthy.
      - name: Confirm the fold converged
        run: npm run dedupe -- --check

      - name: Build the report
        id: report
        run: |
          npm run report:discovery -- \
            --person out/person-sweep.json \
            --log "Internet Archive:out/archive.log" \
            --log "YouTube:out/youtube.log" \
            --dedupe out/dedupe.log \
            --out reports/discovery-latest.md

      # A weekly PR that says "nothing new" teaches everyone to close these
      # unread, and then the one with a real find gets closed too.
      - name: Nothing to report
        if: steps.report.outputs.findings == '0'
        run: echo "No new shows or credits found. Not opening a PR."

      - name: Open or update the pull request
        if: steps.report.outputs.findings != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=discovery/weekly
          cp out/person-sweep.json reports/discovery-latest.json 2>/dev/null || true

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The branch is rebuilt from the commit this run checked out, every
          # run, and force-pushed.
          #
          # The report-only version continued whatever was already on the
          # branch, to avoid force-pushing. That is the wrong shape now the PR
          # carries data: a branch left over from an earlier week holds `data/`
          # as it was then, and merging it would revert anything that landed on
          # main in between. Freshness wins — fixes go to main, and the next run
          # picks them up.
          #
          # The working tree already holds the fold and the report, both
          # produced against this same commit, so switch branch without
          # disturbing them.
          git checkout -B "$BRANCH"

          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Nothing to push — no duplicates to fold and the report is unchanged."
            exit 0
          fi

          FOLDED=$(sed -n 's/.*(\([0-9]*\) folded).*/\1/p' out/dedupe.log | head -1)
          git commit -m "Weekly discovery sweep: ${{ steps.report.outputs.findings }} finding(s)

          Automated run of .github/workflows/discovery.yml.

          Data change: ${FOLDED:-0} duplicate credit(s) folded. dedupe merges credits
          it can show describe the same appearance and unions their sources; it files
          nothing new and adds no source. Validated inside the run, because a PR opened
          with GITHUB_TOKEN does not trigger validate.yml.

          Report: the discovery candidates under reports/ are NOT filed. Each still
          needs a source closer to the fact before it can become a credit.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push --force-with-lease origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "PR already open for $BRANCH — the push updated it."
            exit 0
          fi

          gh pr create \
            --head "$BRANCH" \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --title "Weekly discovery sweep — ${{ steps.report.outputs.findings }} finding(s)" \
            --body "$(cat <<'BODY'
          Two different things in here, and they are reviewed differently. The full
          report is `reports/discovery-latest.md`.

          ### The data change: duplicate credits, folded

          Any diff under `data/` is `npm run dedupe` and nothing else. It merges
          credits it can show describe the same appearance and unions their sources —
          it files no credit, adds no source, and makes no sourcing claim. Duplicates
          accrue whenever an importer runs and dedupe does not; left alone they render
          one appearance as two, and each half stays single-source while the pair
          cites the same evidence twice.

          Read it as you would any mechanical change: skim that the folds pair up.

          > **This PR is not covered by `validate.yml`.** A PR opened with
          > `GITHUB_TOKEN` does not trigger other workflows. The run validated its own
          > output — schema, referential integrity, and a second dedupe pass to confirm
          > the fold converged — and refuses to push if any of that fails. That in-run
          > check is the only gate this change gets.

          ### The report: discovery candidates, NOT filed

          Nothing from the candidate tables has been written to `data/`. Every one came
          from a reference work or a fan wiki — `reference` or `community` tier at best,
          and Wikipedia is wrong about this project's own subject often enough that
          POLICY.md uses it as the worked example. Acting on one means finding a closer
          source and filing it as a separate change.

          Two passes to read differently:

          - **Person-first** (`npm run discover:person`) diffs against the catalogue as
            it goes, so its tables are a real diff. A show under "no record" is missing
            from everyone in its cast, not just the person who surfaced it.
          - **Internet Archive / YouTube** do not dedupe against `data/`, so their raw
            output is every series they saw, not a list of new ones. Diff before believing.

          The branch is rebuilt from `main` and force-pushed every run, so push fixes to
          `main` rather than onto this branch.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          BODY
          )"
