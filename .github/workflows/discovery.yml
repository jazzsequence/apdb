name: Weekly discovery sweep

# Data collection, moved off whatever machine happens to be awake.
#
# Every import adapter here needs the open internet — Wikipedia, Wikidata, the
# fan wikis, YouTube, archive.org — and a sandboxed agent session frequently
# does not have it. A runner does, on a schedule, for free. So the sweep runs
# here and the result arrives the way everything else in this project arrives:
# as a pull request somebody reads.
#
# This job IMPORTS. It opens a pull request that adds shows, channels and
# credits to `data/`, and it is judged by what it added, not by what it noticed.
#
# An earlier version produced a report instead: a few thousand words of
# candidates for a human to go and investigate. That is the wrong trade. The
# work of turning a lead into a sourced record is the job's, not the reader's,
# and a PR nobody can act on without doing that work is worth nothing.
#
# What it can import automatically is bounded by what can be sourced without
# guessing:
#
#   - archive.org gives show and channel metadata on the item itself, and casts
#     in the uploader's own description.
#   - YouTube gives shows from a channel's playlists, and casts from the
#     production's own video descriptions — the strongest cast source there is,
#     hence `official` tier. A description naming no role yields nothing.
#
# Anything whose show, season or role cannot be resolved from a source stays in
# the report rather than being invented. That residue should shrink over time;
# it is a list of gaps in the importers, not homework for the reviewer.
#
# Because the job writes to `data/`, it validates its own output before pushing.
# A PR opened with GITHUB_TOKEN does not trigger other workflows, so validate.yml
# does NOT run on it — the checks below are the only gate. Do not remove them.

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour on purpose: scheduled jobs pile up at
    # :00 across all of GitHub and get queued.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      people:
        description: 'How many people to sweep (blank = everyone with a QID or a Wikipedia link)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job level, not step level: a step's `if` cannot see that step's own `env`
    # and cannot see `secrets` at all, so checking either there is always false.
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: mkdir -p out

      # Each pass is allowed to fail on its own. One rate-limited source should
      # cost its own section of the report, not the whole week's sweep.
      - name: Person-first sweep (Wikipedia + Wikidata)
        continue-on-error: true
        run: |
          npm run discover:person -- \
            ${{ inputs.people && format('--limit {0}', inputs.people) || '--all' }} \
            --json out/person-sweep.json | tee out/person.log

      # Imports, not dry runs. These write shows, channels and credits into
      # data/, and every record they write carries the source it came from —
      # archive.org item metadata, or the production's own video description.
      - name: Internet Archive — import shows
        continue-on-error: true
        timeout-minutes: 20
        run: npm run import:archive > out/archive.log 2>&1

      # Casts from the uploader's own item description: `official` tier.
      - name: Internet Archive — import casts
        continue-on-error: true
        timeout-minutes: 20
        run: npm run import:archive-casts > out/archive-casts.log 2>&1

      # No key, no pass — and no keyless fallback, because scraping around
      # YouTube's API breaches their terms (see the source registry).
      - name: YouTube — import shows
        continue-on-error: true
        timeout-minutes: 25
        if: env.YOUTUBE_API_KEY != ''
        run: npm run sweep:youtube -- --castable-out out/castable.tsv > out/youtube-shows.log 2>&1

      # sweep:youtube catalogues a show but leaves its cast alone. It writes
      # every playlist whose descriptions are readable to a TSV — read that
      # rather than its stdout, which truncates the list at 25.
      #
      # These are the credits most worth having: a production describing its own
      # episode is the strongest cast source there is, which is why they land as
      # `official` tier rather than `community`.
      - name: YouTube — import casts for the shows it just found
        continue-on-error: true
        timeout-minutes: 25
        if: env.YOUTUBE_API_KEY != ''
        run: |
          set -uo pipefail
          if [ ! -s out/castable.tsv ]; then
            echo "No playlists with a readable cast."; exit 0
          fi
          echo "$(wc -l < out/castable.tsv) playlist(s) with a readable cast."
          while IFS=$'\t' read -r show playlist; do
            [ -z "${show:-}" ] && continue
            echo "--- $show <- $playlist"
            # One bad playlist must not abandon the rest of the queue.
            npm run collect -- --youtube --playlist "$playlist" \
              --show "$show" --season 1 --apply >> out/youtube-casts.log 2>&1 \
              || echo "    failed, continuing"
          done < out/castable.tsv

      - name: YouTube — report channels not yet catalogued
        continue-on-error: true
        if: env.YOUTUBE_API_KEY != ''
        run: npm run discover:youtube > out/youtube.log 2>&1

      # Runs after the sweeps and writes the fold to data/.
      #
      # Duplicates accrue whenever an importer runs and this does not, and they
      # stay invisible until someone opens a particular person's page —
      # fourteen CelebriD&D people sat double-credited for months.
      #
      # Not continue-on-error: this is the data change the PR exists to carry,
      # so a failure here should fail the run rather than quietly open a PR
      # that folds nothing.
      - name: Fold duplicate credits
        run: npm run dedupe | tee out/dedupe.log

      # The safety net that replaces validate.yml, which will not run on this
      # PR. Schema, referential integrity, id uniqueness — the same gate every
      # human PR passes. If this fails, nothing is pushed.
      - name: Validate the folded data
        run: npm run validate

      # dedupe is idempotent, so a second pass must find nothing. If it does
      # find something, the merge rule is not converging and the fold above is
      # not trustworthy.
      - name: Confirm the fold converged
        run: npm run dedupe -- --check

      - name: Build the report
        run: |
          npm run report:discovery -- \
            --person out/person-sweep.json \
            --log "Internet Archive:out/archive.log" \
            --log "YouTube:out/youtube.log" \
            --dedupe out/dedupe.log \
            --out reports/discovery-latest.md

      # What actually landed in data/ — the only thing that decides whether
      # there is a pull request.
      #
      # This used to gate on the report's finding count, which meant a PR could
      # open carrying nothing but a list of things for a human to go and
      # investigate. The point of the job is to add records; if it added none,
      # there is nothing to review.
      - name: Summarise what was added
        id: added
        run: |
          set -uo pipefail
          git add -A data/
          SHOWS=$(git diff --cached --name-only --diff-filter=A -- data/shows | wc -l | tr -d ' ')
          CHANNELS=$(git diff --cached --name-only --diff-filter=A -- data/channels | wc -l | tr -d ' ')
          PEOPLE=$(git diff --cached --name-only --diff-filter=A -- data/people | wc -l | tr -d ' ')
          TOUCHED=$(git diff --cached --name-only -- data/ | wc -l | tr -d ' ')
          # Credits are lines, not files: an existing person gaining a credit
          # shows up as a modified file, not an added one.
          CREDITS=$(git diff --cached -U0 -- data/people | grep -c '^+  - show:' || true)
          echo "shows=$SHOWS"       >> "$GITHUB_OUTPUT"
          echo "channels=$CHANNELS" >> "$GITHUB_OUTPUT"
          echo "people=$PEOPLE"     >> "$GITHUB_OUTPUT"
          echo "credits=$CREDITS"   >> "$GITHUB_OUTPUT"
          echo "touched=$TOUCHED"   >> "$GITHUB_OUTPUT"
          echo "Added: $SHOWS show(s), $CHANNELS channel(s), $PEOPLE person file(s), $CREDITS credit(s)."
          echo "$TOUCHED file(s) under data/ changed."

      # The raw sweep, as a build artifact rather than a commit.
      #
      # It is ~2.4 MB of JSON and it is regenerated in full every week, so
      # committing it puts a fresh 2.4 MB in git history every Monday forever
      # for something nobody reads by hand — the markdown report is the
      # readable artifact. Ninety days of retention is longer than a candidate
      # queue stays interesting.
      - name: Upload the raw sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-sweep-${{ github.run_id }}
          path: out/
          retention-days: 90

      # A weekly PR that adds nothing teaches everyone to close these unread,
      # and then the one with real records in it gets closed too.
      - name: Nothing was added
        if: steps.added.outputs.touched == '0'
        run: echo "No new shows, channels or credits. Not opening a PR."

      - name: Open or update the pull request
        if: steps.added.outputs.touched != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=discovery/weekly

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # --force-with-lease needs a remote-tracking ref to compare against,
          # and a fresh runner checkout has never seen this branch — without
          # this fetch the push aborts with "stale info" the moment the branch
          # exists from a previous week. Fetching first is what makes the lease
          # mean "nobody has moved it since I looked" rather than nothing.
          git fetch origin "$BRANCH" 2>/dev/null || echo "No existing $BRANCH — first run."

          # The branch is rebuilt from the commit this run checked out, every
          # run, and force-pushed.
          #
          # The report-only version continued whatever was already on the
          # branch, to avoid force-pushing. That is the wrong shape now the PR
          # carries data: a branch left over from an earlier week holds `data/`
          # as it was then, and merging it would revert anything that landed on
          # main in between. Freshness wins — fixes go to main, and the next run
          # picks them up.
          #
          # The working tree already holds the fold and the report, both
          # produced against this same commit, so switch branch without
          # disturbing them.
          git checkout -B "$BRANCH"

          git add data/ reports/
          if git diff --cached --quiet; then
            echo "Nothing to push — no duplicates to fold and the report is unchanged."
            exit 0
          fi

          FOLDED=$(sed -n 's/.*(\([0-9]*\) folded).*/\1/p' out/dedupe.log | head -1)
          git commit -m "Weekly import: ${{ steps.added.outputs.shows }} show(s), ${{ steps.added.outputs.credits }} credit(s)

          Automated run of .github/workflows/discovery.yml.

          Added: ${{ steps.added.outputs.shows }} show(s), ${{ steps.added.outputs.channels }} channel(s),
          ${{ steps.added.outputs.people }} new person file(s), ${{ steps.added.outputs.credits }} credit(s).
          Also folded ${FOLDED:-0} duplicate credit(s).

          Every record carries the source it came from: archive.org item metadata for
          the Internet Archive passes, and the production's own video description for
          the YouTube ones, which is why those credits are official tier.

          Validated inside the run — schema, referential integrity and a second dedupe
          pass — because a PR opened with GITHUB_TOKEN does not trigger validate.yml.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push --force-with-lease origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo "PR already open for $BRANCH — the push updated it."
            exit 0
          fi

          # `gh pr create` fails with an opaque GraphQL error when the repo
          # setting is off, and the branch is already pushed by this point, so
          # the run's work is not lost — only the PR is missing. Say which
          # setting, and leave a link that opens the PR by hand.
          if ! gh pr create \
            --head "$BRANCH" \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --title "Weekly import — ${{ steps.added.outputs.shows }} show(s), ${{ steps.added.outputs.credits }} credit(s)" \
            --body "$(cat <<'BODY'
          Records added by the weekly import. **This is a data PR** — read the `data/`
          diff, not prose.

          | | added |
          | --- | --- |
          | Shows | ${{ steps.added.outputs.shows }} |
          | Channels | ${{ steps.added.outputs.channels }} |
          | New people | ${{ steps.added.outputs.people }} |
          | Credits | ${{ steps.added.outputs.credits }} |

          Every record carries the source it was built from, on the record itself:

          - **Internet Archive** — show and channel metadata from the archive item, and
            casts from the uploader's own description (`official` tier).
          - **YouTube** — shows from the channel's own playlists, and casts read out of
            the production's own video descriptions (`official` tier). A description
            that names no role yields nothing rather than a guess.

          Duplicates were folded before committing, and the fold was re-run to confirm
          it converged.

          > **`validate.yml` does not run on this PR** — a PR opened with `GITHUB_TOKEN`
          > does not trigger other workflows. The job validated its own output instead:
          > schema, referential integrity, id uniqueness and a second dedupe pass. It
          > refuses to push if any of that fails, so this is the only gate the change
          > gets.

          `reports/discovery-latest.md` is attached for the leads that could **not** be
          imported automatically — anything whose show, season or role could not be
          resolved from a source without guessing. It is reference material, not a
          to-do list you are expected to work through.

          The branch is rebuilt from `main` and force-pushed every run, so push fixes to
          `main` rather than onto this branch.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          BODY
          )"; then
            echo "::error::Could not open the pull request."
            echo "The branch '$BRANCH' IS pushed — this run's work is not lost, only the PR."
            echo ""
            echo "Most likely cause: Settings > Actions > General > Workflow permissions"
            echo "  > 'Allow GitHub Actions to create and approve pull requests' is off."
            echo "  gh api -X PUT repos/${{ github.repository }}/actions/permissions/workflow \\"
            echo "    -f default_workflow_permissions=read -F can_approve_pull_request_reviews=true"
            echo ""
            echo "Or open it by hand:"
            echo "  ${{ github.server_url }}/${{ github.repository }}/compare/$BRANCH?expand=1"
            exit 1
          fi
