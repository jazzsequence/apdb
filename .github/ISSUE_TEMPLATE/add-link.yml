name: Add a missing link
description: You know where to watch or listen to a show, season or channel that has no link here.
title: '[link] '
labels: [link]
body:
  - type: markdown
    attributes:
      value: |
        An index that tells you a season exists but not where to watch it is
        only half an answer. 96 seasons here have no link of their own, usually
        because their title is something like "Season 3" and nothing could be
        matched to it automatically.

        **A link to the season is far more useful than a link to the channel.**
        Most productions publish one playlist per campaign, and that is what
        someone reading a season page is looking for.

  - type: input
    id: where
    attributes:
      label: Which page
      description: Paste the URL from actualplaydb.com.
      placeholder: https://actualplaydb.com/shows/critical-role/4/
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: The link
      description: |
        A playlist, podcast feed, archive page or official page — whatever gets
        someone to the thing itself.
      placeholder: https://www.youtube.com/playlist?list=PL1tiwbzkOjQz…
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: What does this link cover?
      description: |
        This decides where it goes. A link that covers a whole show is recorded
        on the show; one that covers a single season goes on that season, so
        the season page can stop pointing at the show.
      options:
        - This one season or campaign
        - The whole show
        - The channel's whole output
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: |
        If several playlists exist for the same season, or the numbering here
        does not match the numbering there, say so — that mismatch is usually
        why nothing could be matched automatically.
      placeholder: |
        Their playlist calls this "Book 2" but it is the same run as season 3 here.
