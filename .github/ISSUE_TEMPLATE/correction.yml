name: Correct or amend an existing entry
description: Something we already list is wrong, incomplete, or duplicated.
title: '[correction] '
labels: [correction]
body:
  - type: markdown
    attributes:
      value: |
        Corrections are as valuable as new credits, and the ones about *shows*
        are the most valuable of all — a scripted comedy filed as an actual play,
        or a system left at the D&D default, is worse than a missing credit.

        **If you are comfortable editing a YAML file, there is a faster path.**
        Every page has an "edit this file" link that opens the file in GitHub's
        editor and turns your change into a pull request directly, with no
        manual transcription in between. This form exists for everyone else.

  - type: input
    id: where
    attributes:
      label: Which page
      description: Paste the URL, or name the person / show.
      placeholder: /people/aabria-iyengar/ — the Pirates of Salt Bay credit
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      description: >-
        Every option here corresponds to a mistake this database has actually
        made. If several apply, pick the worst one and explain in the box below.
      options:
        - 'Show: this is not an actual play at all'
        - 'Show: wrong game system'
        - 'Show: wrong season, or seasons that should be one show'
        - 'Show: this is one season of another show, not its own show'
        - 'Show: wrong or missing link to where you can watch it'
        - 'Show: this is a duplicate of another entry'
        - 'Show: something else is wrong'
        - 'Credit: wrong role (listed as a player, actually GMed)'
        - 'Credit: wrong or missing character'
        - 'Credit: wrong season or episode'
        - 'Credit: wrong name they were billed under'
        - 'Credit: this credit does not belong to this person at all'
        - 'Person: this is not a real person (a character or company got imported)'
        - 'Person: two entries are the same person'
        - 'Channel or game: something is wrong'
        - Something else
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: What should it say instead
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: How do you know
      description: >-
        A link is ideal. "I watched it" is a valid answer — say so, and we'll
        record it as a first-hand account.
    validations:
      required: true
