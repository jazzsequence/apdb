# Merged from `jackson-kelly`, on the balance of evidence rather than a source
# that states it: the Saving Throw wiki bills "Jack Kelly" as Buckshot on Masks
# and "Jackson Kelly" as Durga on The Realms of Rothaen, same network, and Jack
# is the ordinary diminutive of Jackson. Two people of that name on one small
# podcast network, neither with a page anywhere, is the less likely reading.
#
# Searched and found nothing either way: no person page on the wiki for either
# spelling, no handles on the show pages, and the only "Jackson Kelly" findable
# elsewhere is a film and television actor with no actual-play credits.
#
# Note that a shared show is NOT required to suspect this. One person credited
# under two names on two different shows is the alias gap this project exists
# to close, so "different shows" is the expected shape of the problem, not an
# argument against it.
#
# Also removed here: wikidata_qid Q1253621 and a 1957 ABC publicity photograph,
# both belonging to Jack Kelly the American actor and politician, 1927-1992,
# who died well before either of these shows existed.
