# NOT the same person as `anna-prosser`, and the two should not be merged.
#
# Worth stating because a plausible-sounding web result asserts that Judge on
# The Chain of Acheron is played by Anna Prosser. The MCDM wiki, which is the
# closer source, says Anna Coulter — MCDM Productions' CEO and later COO — and
# gives her no other name.
#
# The maiden/married-name possibility was checked rather than dismissed, since
# that is exactly the case this project's alias system exists for. Anna
# Prosser's documented married name is Robinson, which is already an alias on
# her record; she is reported to have married Nathan Sharp in 2022. Neither is
# Coulter, and nothing connects the two beyond a shared first name.
