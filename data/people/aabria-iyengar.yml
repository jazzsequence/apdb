id: aabria-iyengar
canonical_name: Aabria Iyengar
sort_name: Iyengar, Aabria
pronouns: she/her
wikidata_qid: Q117600290
bio: >-
  Game master, player and performer. Came up through independent Twitch
  productions on the Saving Throw channel before GMing Exandria Unlimited and
  Dimension 20, and co-founding the creator-owned studio Worlds Beyond Number.
links:
  wikipedia: https://en.wikipedia.org/wiki/Aabria_Iyengar

# The alias case this database exists to handle. Born Lipscomb; Iyengar was
# taken on marriage. Aggregators that key on the credited string file the two
# names as unrelated people, which makes the pre-name-change indie work
# structurally invisible. Here they are one person with two names.
aliases:
  - id: iyengar
    name: Aabria Iyengar
    alias_type: legal
    note: >-
      The name every reference work and wiki uses for her. Note that those
      sources apply current names retroactively, so a credit attributed here on
      their authority reflects the source's naming, not a verified title card.
  - id: lipscomb
    name: Aabria Lipscomb
    alias_type: birth
    active_to: '2020'
    note: >-
      Birth name, documented on Wikipedia. Exactly one credit is attributed to
      it — Carefree High, from someone who watched the stream and saw the
      billing. Earlier revisions also attached it to the 2019 Saving Throw
      credits by reasoning from dates; those attributions have been removed,
      because no source establishes which name was on those billings.

credits:
  # --- The long tail. Neither of these appears in any structured index. -----

  # Mid-season arrival on an indie Monsterhearts game, gone before the end.
  # The show's own cast page lists regulars only, so she is absent from it —
  # which is exactly how a credit like this disappears everywhere else.
  - show: carefree-high
    season: 1
    role: player
    alias: lipscomb
    note: >-
      Joined mid-season and departed before the campaign ended, so she is not
      on the show's published cast list. Character name and the episode range
      she appears in are still open.
    sources:
      - tier: firsthand
        attested_by: Project maintainer, from direct listening
        note: >-
          First-hand account: she was at this table, billed under the Lipscomb
          name. No published record contradicts this, and none could confirm it
          either — this show does not document cast changes anywhere. Already
          checked, so nobody repeats the work: the series page and the
          per-episode show notes (identical boilerplate on all 11 episodes, "GMs:
          Mac & Adam. Players: Tappy, Gina, Joey, Mac, Adam"); the forum's
          character-roster thread, which covers only the five starting players
          and was last edited 10 May 2018, a week into the run; the episode 11
          discussion thread, which references only those original characters; and
          a site-wide forum search. Corroboration would have to come from the
          episode audio or from another listener.

  - show: wildcards-east-texas-university
    season: 1
    episode: 'S1E?: The Seekers'
    role: guest player
    character: Renee Billings
    year: '2019'
    note: >-
      Single-episode guest appearance on an independent Savage Worlds campaign.
      Episode number within season 1 not yet confirmed. No `alias` recorded: the
      appearance is sourced but nobody has established which name was on the
      billing, and Wikipedia names her Iyengar throughout regardless of period.
    sources:
      - tier: reference
        url: https://en.wikipedia.org/wiki/Aabria_Iyengar
        note: Appearance and character sourced to Wikipedia.

  - show: pirates-of-salt-bay
    season: 1
    role: GM/DM
    year: '2019'
    note: >-
      No `alias` recorded. An earlier revision put this under the Lipscomb name,
      reasoned from the 2019 date — but no source says which name was on the
      billing, and the wiki that documents this show names her Iyengar. That was
      a guess in a field that used to be mandatory, and it is not knowledge.
    sources:
      - tier: community
        url: https://savingthrowshow.fandom.com/wiki/Pirates_of_Salt_Bay
        note: >-
          Saving Throw wiki names her as the regular GM. Note Wikipedia's
          filmography table instead lists her as a player on this show; the
          show-specific wiki is taken as the better source.
