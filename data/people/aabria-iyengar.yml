id: aabria-iyengar
canonical_name: Aabria Iyengar
sort_name: Iyengar, Aabria
pronouns: she/her
wikidata_qid: Q117600290
bio: >-
  Game master, player and performer. Came up through independent Twitch
  productions on the Saving Throw channel before GMing Exandria Unlimited and
  Dimension 20, and co-founding the creator-owned studio Worlds Beyond Number.
links:
  wikipedia: https://en.wikipedia.org/wiki/Aabria_Iyengar

# The alias case this database exists to handle. Born Lipscomb; Iyengar was
# taken on marriage. Aggregators that key on the credited string file the two
# names as unrelated people, which makes the pre-name-change indie work
# structurally invisible. Here they are one person with two names.
aliases:
  - id: iyengar
    name: Aabria Iyengar
    alias_type: legal
    note: Name used on all credits documented in secondary sources.
  - id: lipscomb
    name: Aabria Lipscomb
    alias_type: birth
    active_to: '2020'
    note: >-
      Birth name, documented on Wikipedia. Her Carefree High credit is billed
      under this name per maintainer report; the other credits attributed to it
      are inferred from their dates rather than from a seen credit, and are
      flagged needs_verification pending a check against the original title
      cards.

credits:
  # --- The long tail. Neither of these appears in any structured index. -----

  # Mid-season arrival on an indie Monsterhearts game, gone before the end.
  # The show's own cast page lists regulars only, so she is absent from it —
  # which is exactly how a credit like this disappears everywhere else.
  - show: carefree-high
    season: 1
    role: player
    alias: lipscomb
    note: >-
      Joined mid-season and departed before the campaign ended, so she is not
      on the show's published cast list. Character name and the episode range
      she appears in are still open.
    source:
      note: >-
        Reported by the project maintainer from direct listening; billed under
        the Lipscomb name. An episode-level check found no corroboration and no
        contradiction — the published record simply does not track cast changes
        on this show. Checked: the series page and the per-episode show notes
        (identical boilerplate on every episode, "GMs: Mac & Adam. Players:
        Tappy, Gina, Joey, Mac, Adam"); the forum's character-roster thread,
        which lists the five starting players with characters and playbooks and
        was last edited 10 May 2018, a week into the run; the episode 11
        discussion thread, which references only those original characters; and
        a site-wide search. Resolving this needs the audio itself.
      needs_verification: true

