description: A non-serious TTRPG podcast started by a group of 6 friends to
  document the shenanigans and mishaps of their campaigns; games played so
  far include D&D 5e, Cyberpunk RED, Lancer, Monster of the Week, Salvage
  Union and Honey Heist. System per source, per season/campaign — recorded
  here as a multi-system anthology since campaigns rotate systems entirely
  rather than mixing them within one season.
