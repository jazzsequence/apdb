description: "Standalone games and limited series from Critical Role
  Productions, outside the numbered campaigns. An anthology: the system differs
  per one-shot. UnDeadwood is Deadlands: Reloaded and both Age of Umbra runs are
  Daggerheart; the rest are recorded as D&D 5e and Thresher, Moonward and Unend
  have not been verified."
