description: A 24-hour charity marathon for Rainbow Railroad (which helps
  LGBTQIA+ people in hostile countries reach safety), aired 2020-02-21 as six
  back-to-back one-shots in different systems, not a single ongoing campaign
  — each "season" below is one segment. Player rosters are as credited in the
  episode listings, first names only where that's all that was given.
