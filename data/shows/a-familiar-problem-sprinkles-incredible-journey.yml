description: Standalone Critical Role one-shot, played in A Familiar Problem — a
  one-page game about the party's pets and familiars. Professor Thaddeus was
  decided by Archie, a live Eurasian eagle-owl, whose head turns chose the
  character's actions, with Marisha Ray speaking for him. Archie is credited on
  the show's own page but is not indexed here as a performer.
