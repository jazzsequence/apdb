format: podcast
status: cancelled
description: >-
  Monsterhearts 2 campaign about monstrous teenagers in Carefree, Arizona, 1992.
  Ran 11 episodes and ended without a conclusion — the group chose to stop,
  citing the emotional weight of the game and the wellbeing of the people at the
  table. GMed by Mac and Adam, with players credited as Tappy, Gina, Joey, Mac
  and Adam — handles and first names only, which is why credits on this show are
  hard to attribute to a person.
