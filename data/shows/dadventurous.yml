description: "System per source: D&D 5th Edition. \"A Dad & Daughter Dungeons &
  Dragons Actual Play for all ages,\" per the show's own site — still
  posting new episodes as of mid-2026. This
  entry covers only the original campaign, \"Elsewhere\"; the feed also carries
  at least two more, Bloomhaven (D&D) and Adventure Skeletons: Hazard Play (a
  different game by Grant Howitt), neither indexed here yet. No performer names
  given here or found — the show credits its cast only as \"Dad\" and
  \"daughter.\""
