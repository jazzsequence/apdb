description: "System per source: D&D 5th Edition (homebrew setting). Plus
  One to Gaming's original campaign, told across three sub-arcs sharing
  one continuity — the Adventurer's Guild party in Greystock's Notes,
  the Omega Squad party in A Miner Issue, and the two-part Journey to
  Gravelton/Granitos — plus two interludes."
