description: "Cosmic horror and black comedy meld in this award-winning audio
  drama that explores Lovecraftian lore in queer and uncanny ways. Each season
  is a standalone tale where our cast lives the terror in an unholy fusion of
  live tabletop roleplaying and cinematic audio fiction. Thrill as unlikely
  heroes from all walks of life face down eldritch nightmares, unholy rituals,
  kindly creatures, and monstrous "
