description: Welcome to our campaign in Daggerheart! The PCs are part of a storied mercenary company called the Dalian Company, escorting a relic of utmost importance across the war-ravaged continent of Althas. As they take some well-earned rest in a small town on a day of celebration, the atmosphere soon takes a dark turn...
    This is our Actual Play of the tabletop RPG Daggerheart using the Five Banners Burning framework, created and published by Darrington Press.
